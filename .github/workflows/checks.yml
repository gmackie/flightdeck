name: checks
on: [push, pull_request]
jobs:
  build-test-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: End-to-end in-memory Worker, browser and private RPC test
        run: pnpm test:integration
      - name: Deployment and recovery CLI tests
        run: pnpm test:deployment
      - name: Universal installer simulation tests
        run: pnpm test:installer
      - name: Local web wizard security tests
        run: pnpm test:install-web
      - run: pnpm test:govern
      - name: Validate installers without mutating Cloudflare
        run: |
          node --check scripts/setup.mjs
          node --check scripts/setup-console.mjs
          node --check scripts/doctor.mjs
          node --check scripts/source.mjs
          node --check scripts/source-governance.mjs
          node --check scripts/workspace-deploy.mjs
          node --check scripts/install-cloudflare.mjs
          node --check scripts/install-web.mjs
          node --check scripts/install/ui.js
          node --check scripts/install/engine.mjs
          node --check scripts/install/cloudflare.mjs
          node --check scripts/install/basin.mjs
          node --check scripts/install/config.mjs
          node --check scripts/install/wizard.mjs
          pnpm install:cloudflare -- --dry-run --account-id 0123456789abcdef0123456789abcdef --slug test --admin-emails owner@example.com --mode intelligence
          node --check scripts/backup.mjs
          node --check scripts/restore.mjs
          node --check scripts/doctor-remote.mjs
          node scripts/workspace-deploy.mjs --d1-id 12345678-1234-1234-1234-123456789abc --stream-id stream_1234 --account-id 0123456789abcdef0123456789abcdef --host analytics.example.com --access-domain team.cloudflareaccess.com --access-aud 0123456789abcdef0123456789abcdef --admin-email owner@example.com --dry-run

          node scripts/setup.mjs --dry-run --mode r2 --yes
          node scripts/setup-console.mjs --dry-run --yes --host analytics.example.com --access-domain example.cloudflareaccess.com --access-aud 0123456789abcdef0123456789abcdef --account-id 0123456789abcdef0123456789abcdef
      - name: Bundle Core Worker (dry run)
        run: pnpm exec wrangler deploy --dry-run --config apps/core/wrangler.jsonc
      - name: Bundle Console Worker (dry run)
        run: pnpm exec wrangler deploy --dry-run --config apps/console/wrangler.jsonc
      - name: Bundle Journey Worker (dry run)
        run: pnpm exec wrangler deploy --dry-run --config apps/journey/wrangler.jsonc
      - name: Bundle optional MCP Worker (dry run)
        run: pnpm exec wrangler deploy --dry-run --config apps/mcp/wrangler.jsonc
      - name: Pack reusable SDKs
        run: |
          pnpm --filter @flightdeck/contracts pack --pack-destination ./dist-packages
          pnpm --filter @flightdeck/sdk-worker pack --pack-destination ./dist-packages
          pnpm --filter @flightdeck/sdk-effect pack --pack-destination ./dist-packages
          pnpm --filter @flightdeck/browser pack --pack-destination ./dist-packages
          pnpm --filter @flightdeck/knowledge pack --pack-destination ./dist-packages
          pnpm --filter @flightdeck/experiments pack --pack-destination ./dist-packages
          pnpm --filter @flightdeck/simulator pack --pack-destination ./dist-packages
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: flightdeck-sdk-packages
          path: dist-packages/*.tgz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-lockfile
          path: pnpm-lock.yaml
