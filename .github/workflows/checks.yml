name: checks
on: [push, pull_request]
jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @flightdeck/sdk-worker pack --pack-destination ../../dist-packages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-lockfile
          path: pnpm-lock.yaml
